        <h1>폼 태그</h1>
        <form>
            <fieldset>
                <legend>인풋태그</legend>
                <label for="id">아이디</label>
                <input type="text" id="id">
                <br>
                <label for="password">비밀번호</label>
                <input type="password" id="password">
                <br>
                <label for="email">이메일</label>
                <input type="email" id="email">
                <br>
                <label for="tel">전화번호</label>
                <input type="tel" id="tel">

                <h2>체크박스</h2>
                <label for="1">1</label>
                <input type="checkbox" id="1">
                <label for="2">2</label>
                <input type="checkbox" id="2">
                <label for="3">3</label>
                <input type="checkbox" id="3">

                <h2>라디오 과일 하나 선택</h2>
                <input type="radio" id="apple" name="fruits">
                <label for="apple">사과</label>
                
                <input type="radio" id="banana" name="fruits">
                <label for="banana">바나나</label>
                
                <input type="radio" id="peach" name="fruits">
                <label for="peach">복숭아</label>

                <h2>파일</h2>
                <input type="file" >
                
                <h2>기타 폼요소 </h2>
                <label for="textarea1">문의내용</label>
                <textarea name="textarea" id="textarea1"></textarea>
                <br>
                
                <label for="select1">문의유형</label>
                <select  id="select1">
                    <option value="a">a</option>
                    <option value="b">b</option>
                    <option value="c">c</option>
                </select>

                <button type="button">클릭</button>
            </fieldset>



        </form>
